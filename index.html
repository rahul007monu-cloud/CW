<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CW — Doorstep car wash with monthly & yearly plans</title>
    <meta name="description" content="Doorstep car wash and cleaning at your home, office or society parking. Monthly and yearly subscription plans for hatchback, sedan and SUV." />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="CW — Showroom shine at your doorstep" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:description" content="Monthly & yearly doorstep car wash plans." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- App splash: shown instantly, removed when the 3D showroom is ready -->
    <div id="splash" aria-hidden="true">
      <img src="/logo.svg" alt="" width="112" height="112" />
      <span>DOORSTEP CAR WASH</span>
      <i></i>
    </div>
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 45%, #0d1a2e, #05070d 65%); transition: opacity .6s ease, visibility .6s; }
      #splash img { border-radius: 26px; box-shadow: 0 0 60px -10px rgba(34,211,238,.8); animation: splash-pop 1.6s ease-in-out infinite; }
      #splash span { font: 600 11px/1 Inter, system-ui, sans-serif; letter-spacing: .3em; color: #22d3ee; }
      #splash i { width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #22d3ee, transparent); background-size: 200% 100%; animation: splash-bar 1.2s linear infinite; }
      #splash.hide { opacity: 0; visibility: hidden; }
      @keyframes splash-pop { 50% { transform: scale(1.06); } }
      @keyframes splash-bar { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
